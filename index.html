<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vivid - A privacy-respecting alternative YouTube frontend">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vivid</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <header id="header">
    <div class="header-inner">
      <a href="#/" class="logo" id="logo-link">
        <span class="logo-icon">▶</span>
        <span class="logo-text">Vivid</span>
      </a>
      <form id="search-form" class="search-form">
        <input type="text" id="search-input" placeholder="Search..." autocomplete="off">
        <button type="button" id="search-btn" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </form>
      <button id="mobile-menu-btn" class="mobile-menu-btn" title="Menu" aria-label="Menu" style="display: none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <nav class="header-nav" id="header-nav">
        <a href="#/" id="nav-home" class="nav-link" title="Trending">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M17.56 21H6.44a2.5 2.5 0 01-2.5-2.5V10.9a2.5 2.5 0 01.93-1.95l5.56-4.45a2.5 2.5 0 013.14 0l5.56 4.45a2.5 2.5 0 01.93 1.95v7.6a2.5 2.5 0 01-2.5 2.5z" />
          </svg>
          <span class="nav-label">Home</span>
        </a>
        <a href="#/playlists" id="nav-playlists" class="nav-link" title="Playlists">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3-5-3z"/>
          </svg>
          <span class="nav-label">Playlists</span>
        </a>
        <button id="account-btn" class="nav-link" title="Account" aria-label="Account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span class="nav-label">Account</span>
        </button>
        <button id="settings-btn" class="nav-link" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
          <span class="nav-label">Settings</span>
        </button>
        <button id="theme-toggle" class="nav-link" title="Toggle theme" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" />
          </svg>
          <span class="nav-label">Theme</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="app">
    <div id="loading" class="loading">
      <div class="spinner"></div>
    </div>
  </main>

  <footer id="footer">
    <div class="footer-inner">
      <p>Vivid | <a href="/api/v1" target="_blank">API</a> | <span id="footer-version"></span> | <a href="https://github.com/TeamVivid/Vivid" target="_blank" rel="noopener">Source Code</a> | <a href="https://github.com/TeamVivid/Vivid/blob/main/LICENSE" target="_blank" rel="noopener">License</a> | <a href="#/privacy" id="footer-privacy">Privacy Policy</a></p>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
